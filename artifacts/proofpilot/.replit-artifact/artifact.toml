kind = "web"
previewPath = "/"
title = "ProofPilot"
description = "An evidence-backed decision workspace where humans set priorities, agents investigate through WebMCP, and every consequential recommendation stays human-approved."
version = "1.0.0"
id = "artifacts/proofpilot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18983

[services.development]
run = "pnpm --filter @workspace/proofpilot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/proofpilot", "run", "build" ]
serve = "static"
publicDir = "artifacts/proofpilot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18983"
BASE_PATH = "/"
